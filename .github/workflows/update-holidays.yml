name: Update and publish Korean holidays

on:
  schedule:
    # 03:17 KST daily; keep away from the top of the hour.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-holiday-data
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out data repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate versioned holiday data
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: python3 scripts/update_holidays.py --output data

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp -R data/. _site/
          cp site/index.html _site/index.html

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update Korean public holidays"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
